<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ZeeOps Chat Widget">
  <!-- The dashboard header mark: the white chat bubble on a blue-600 rounded
       tile that sits next to "ZeeOps Chat Widget" in app/page.tsx. Same glyph
       path, same #2563eb, so the tab icon and the in-app logo are one identity.

       Authored full-bleed at 64 units. The corner radius is 25% here rather
       than the header's 37.5% (rounded-xl on a 32px tile): at 16px a radius
       that large eats the silhouette and the mark reads as a circle. -->
  <rect width="64" height="64" rx="16" fill="#2563eb"/>
  <g transform="translate(12 12) scale(1.6667)">
    <path fill="#ffffff" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
  </g>
</svg>
